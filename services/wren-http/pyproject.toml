[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "wren-http"
version = "0.1.0"
description = "Generic authenticated HTTP boundary for Wren semantic planning and execution"
requires-python = ">=3.11"
dependencies = [
  "duckdb>=1.3,<2",
  "fastapi>=0.115,<1",
  "httpx>=0.27,<1",
  "onnxruntime>=1.17,<1.21",
  "pydantic>=2,<3",
  "pydantic-settings>=2.6,<3",
  "sqlglot>=29,<30",
  "uvicorn>=0.30,<1",
  "wrenai[postgres,memory-onnx]==0.14.0",
  "wren-pydantic==0.3.0",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "ruff>=0.9,<1"]

[tool.hatch.build.targets.wheel]
packages = ["src/wren_http"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "../../core/wren/src"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
